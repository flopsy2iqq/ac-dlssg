[ABOUT]
NAME = AC DLSS-G
AUTHOR = ac-dlssg
VERSION = 0.2.0
DESCRIPTION = Frame generation settings and status of the ac-dlssg bridge. In the background it also publishes the main camera to the bridge, whether or not the window is open.

[CORE]
; NONE: CSP loads the script when Assetto Corsa loads and runs it until AC
; closes, whether or not a window is open, so the camera writer always runs.
LAZY = NONE

; The settings window (spec 6.9), in ReShade mode and in standalone mode.
[WINDOW_...]
ID = main
NAME = AC DLSS-G
; The mark of the logo (docs/logo, drawn by tools/brand/make_logo.py).
ICON = icon.png
FUNCTION_MAIN = windowMain
MIN_SIZE = 300, 240
SIZE = 360, 500
