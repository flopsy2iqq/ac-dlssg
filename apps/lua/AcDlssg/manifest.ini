[ABOUT]
NAME = AC DLSS-G Camera
AUTHOR = ac-dlssg
VERSION = 0.1.0
DESCRIPTION = Publishes the main camera to the ac-dlssg frame generation bridge. Runs in the background and has no visible window.

[CORE]
; NONE: CSP loads the script when Assetto Corsa loads and runs it until AC
; closes, whether or not a window is open.
LAZY = NONE

; A stub window that never shows: HIDDEN windows open only when a script asks
; for them (CSP's own ControllerTweaks and RallyCopilot apps use the flag the
; same way), and this app never does.
[WINDOW_...]
ID = main
NAME = AC DLSS-G Camera
FUNCTION_MAIN = windowMain
FLAGS = HIDDEN, NO_TITLE_BAR, NO_BACKGROUND, NO_SCROLLBAR, NO_COLLAPSE, FIXED_SIZE
SIZE = 4, 4
MIN_SIZE = 4, 4
MAX_SIZE = 4, 4
