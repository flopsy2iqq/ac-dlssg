# Publishes a release for a pushed tag v<major.minor.patch>: build.yml builds
# and tests the tag, then this workflow checks that the tag matches the
# project VERSION and has a CHANGELOG.md section, attests the zip,
# ac-dlssg.dll and the driver-profile helper ac-dlssg-drs.exe (GitHub build
# provenance), and creates the GitHub release with the zip attached. The
# release notes are the version's CHANGELOG.md section, the SHA-256 of those
# files and the command that verifies them. Then, when the repository
# variable NEXUSMODS_FILE_ID is set, the nexus job uploads the same zip to
# Nexus Mods as a new version of that file (see the job).
name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  build:
    uses: ./.github/workflows/build.yml
    permissions:
      contents: read

  release:
    needs: build
    runs-on: windows-latest
    timeout-minutes: 20
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      VERSION: ${{ needs.build.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Download the release zip
        uses: actions/download-artifact@v4
        with:
          name: ac-dlssg-${{ needs.build.outputs.version }}
          path: dist

      # Fails, before anything is published, when the tag is not v<VERSION>,
      # CHANGELOG.md has no section for VERSION, or the DLL or the helper in
      # the zip is not the build's.
      - name: Write the release notes
        shell: powershell
        run: |
          $ErrorActionPreference = 'Continue'
          powershell -NoProfile -ExecutionPolicy Bypass -File tools\release-notes.ps1 -Tag $env:GITHUB_REF_NAME `
              -Zip "dist\package\ac-dlssg-$env:VERSION.zip" -Dll dist\Release\ac-dlssg.dll `
              -Helper dist\Release\ac-dlssg-drs.exe -OutFile dist\release-notes.md
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Attest the zip, ac-dlssg.dll and ac-dlssg-drs.exe
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            dist/package/ac-dlssg-${{ needs.build.outputs.version }}.zip
            dist/Release/ac-dlssg.dll
            dist/Release/ac-dlssg-drs.exe

      - name: Create the GitHub release
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Continue'
          gh release create $env:GITHUB_REF_NAME "dist\package\ac-dlssg-$env:VERSION.zip" --verify-tag `
              --title "ac-dlssg $env:VERSION" --notes-file dist\release-notes.md
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

  # Uploads the zip to Nexus Mods (https://www.nexusmods.com/assettocorsa/mods/124)
  # as a new version of its main file, with Nexus Mods' own upload action
  # (v3 Upload API), pinned to the commit of its tag. It runs only when the
  # repository variable NEXUSMODS_FILE_ID holds that file's ID (Nexus: Files
  # tab, the file's Advanced option) and reads the personal API key from the
  # secret NEXUSMODS_API_KEY (https://www.nexusmods.com/settings/api-keys).
  # The previous version is archived, the mod's version follows, and mod
  # manager downloads are off (the mod needs install.bat; 1.2.0's file had them on).
  # The page description and the changelog entry are not part of it.
  nexus:
    needs: [build, release]
    if: ${{ vars.NEXUSMODS_FILE_ID != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Download the release zip
        uses: actions/download-artifact@v4
        with:
          name: ac-dlssg-${{ needs.build.outputs.version }}
          path: dist

      - name: Upload the zip to Nexus Mods
        uses: Nexus-Mods/upload-action@98532f7670c27cbecc78fae03fa3e278147827e2 # v1.0.0-beta.11
        with:
          api_key: ${{ secrets.NEXUSMODS_API_KEY }}
          file_id: ${{ vars.NEXUSMODS_FILE_ID }}
          filename: dist/package/ac-dlssg-${{ needs.build.outputs.version }}.zip
          version: ${{ needs.build.outputs.version }}
          display_name: ac-dlssg ${{ needs.build.outputs.version }}
          description: >-
            Release ${{ needs.build.outputs.version }}. Unpack, run install.bat. It downloads NVIDIA Streamline;
            on RTX 20/30 also dlssg_for_sm86, on RTX 40 MFG-Unlocker (third-party). On RTX 40/50 its helper
            ac-dlssg-drs.exe asks for admin rights to turn NVIDIA Smooth Motion off for AC only.
          category: main
          archive_existing_version: 'true'
          update_mod_version: 'true'
          show_requirements_pop_up: 'true'
          primary_mod_manager_download: 'false'
          allow_mod_manager_download: 'false'
